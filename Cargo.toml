[package]
name = "ch-iceberg"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
arrow = "56.2.0"
arrow-ipc = { version = "56.2.0", features = ["lz4"]}
clap = { version = "4.5.37", features = ["derive"]}
futures = "0.3.31"
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.45.0", features = ["rt-multi-thread", "io-std", "io-util", "fs"] }
object_store = { version = "0.12.1", features = ["http", "aws"] }
url = "2.5.4"
itertools = "0.14.0"
thiserror = "2.0.12"
mimalloc = "0.1.47"
querystring = "1.1.0"
async-trait = "0.1.89"
iceberg-rust = "0.9.0"
iceberg-rust-spec = "0.9.0"
ch-udf-common = { git = "https://github.com/agnosticeng/ch-udf-common.git", tag = "v0.3.0" }
